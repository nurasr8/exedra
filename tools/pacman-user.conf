# User-mode pacman: download-only cache fill without root.
# Usage: fakeroot pacman --config tools/pacman-user.conf -Sw <pkgs>
# (fakeroot fakes euid 0; DisableSandbox+SigLevel avoid privilege ops)
[options]
Architecture = auto
DisableSandbox
SigLevel = Never
DBPath = /tmp/opencode/pacdb
CacheDir = /home/veniam/pkgcache
LogFile = /tmp/opencode/pacman.log

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
