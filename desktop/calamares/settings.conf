---
# Exedra installer sequence
modules:
  - welcome:
      requirements:
        requiredStorage: 8.0
        requiredRam: 2.0
        internet: false
        root: true
  - locale
  - keyboard
  - partition:
      efiSystemPartition: "/boot"
      enableLuks: false
      userSwapChoices:
        - none
        - file
      drawNestedPartitions: true
      defaultFileSystemType: "ext4"
  - users:
      userGroup: users
      autologinGroup: autologin
      sudoersGroup: wheel
      setRootPassword: true
      availableShells: [ /bin/bash ]
  - summary
  - install:
      - mount
      - unpackfs:
          source: "file:///live/rootfs.squashfs"
          sourcefs: "squashfs"
          destination: "/"
      - machineid:
          systemd: true
          dbus: true
      - fstab
      - hwclock:
          rtc: UTC
      - contextualprocess@bootloader:
          script:
            - bootctl --esp-path=/boot install
            - cp /usr/lib/modules/*/vmlinuz /boot/vmlinuz-exedra
            - UUID=$(blkid -s UUID -o value $(findmnt -no SOURCE /)) && printf 'timeout 5\ndefault exedra\n' > /boot/loader/loader.conf && printf 'title Exedra\nlinux /vmlinuz-exedra\ninitrd /initramfs-exedra.img\noptions root=UUID=%s console=ttyS0,115200 quiet\n' "$UUID" > /boot/loader/entries/exedra.conf
      - contextualprocess@exedra-cleanup:
          script:
            - rm -f /etc/sddm.conf.d/autologin.conf
            - rm -f /etc/sudoers.d/live
            - sed -i 's/^# *%wheel ALL=(ALL:ALL) ALL/%wheel ALL=(ALL:ALL) ALL/' /etc/sudoers
      - umount
  - finished:
      restartNowMode: user-checked
      restartNowCommand: "systemctl -i reboot"

branding: exedra
prompt-install: false
dont-chroot: false
oem-banner: ""
disable-cancel: false
disable-cancel-during-exec: false
quitAtEnd: true
